- name: Create a new user roboshop
  ansible.builtin.user:
    name: roboshop
    comment: "roboshop system user"
    system: true
    shell: /sbin/nologin
    home: /app
    state: present

- name: remove directory if exists
  ansible.builtin.file:
    path: /app
    state: absent

- name: create a app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download {{ component }} app zip file
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component }}.zip

- name: Unzip file already existing on the remote server
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes
